name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: win-debug
          - os: windows-latest
            preset: win-release
          - os: ubuntu-latest
            preset: linux-debug
          - os: ubuntu-latest
            preset: linux-release
          - os: macos-latest
            preset: mac-debug
          - os: macos-latest
            preset: mac-release
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v5

      - name: Cache vcpkg source archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg (pinned commit, manifest mode)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '127402f1c75bb3d5ff6bce04b285faa4930a5aca'

      - name: Install Vulkan software driver and build toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev libasound2-dev autoconf automake autopoint libtool libltdl-dev pkg-config autoconf-archive python3-venv fonts-noto-cjk

      - name: Install lavapipe software Vulkan driver (macOS arm64)
        if: runner.os == 'macOS'
        run: |
          set -e
          brew install zstd spirv-tools llvm vulkan-loader
          curl -sSL -o "$RUNNER_TEMP/lavapipe.tar.gz" https://github.com/rerun-io/lavapipe-build/releases/latest/download/lavapipe-macos-arm64.tar.gz
          tar xzf "$RUNNER_TEMP/lavapipe.tar.gz" -C "$RUNNER_TEMP"
          echo "VK_DRIVER_FILES=$RUNNER_TEMP/lavapipe-macos-arm64/lvp_icd.aarch64.json" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib" >> "$GITHUB_ENV"

      - name: Configure, build and test
        uses: lukka/run-cmake@v10
        with:
          configurePreset: '${{ matrix.preset }}'
          buildPreset: '${{ matrix.preset }}'
          testPreset: '${{ matrix.preset }}'

  format:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: clang-format diff must be empty
        run: |
          clang-format --version
          git ls-files '*.cpp' '*.hpp' '*.h' | xargs -r clang-format --dry-run --Werror

  shader-sync:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v5

      - name: Cache vcpkg source archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg (pinned commit, manifest mode)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '127402f1c75bb3d5ff6bce04b285faa4930a5aca'

      - name: Install SDL3 and build toolchain system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev libasound2-dev autoconf automake autopoint libtool libltdl-dev pkg-config autoconf-archive python3-venv

      - name: Configure to install dxc under vcpkg_installed
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'linux-debug'

      - name: Recompile committed shader bytecode and assert no drift
        env:
          BUILD_DIR: ${{ github.workspace }}/build/linux-debug
        run: |
          pwsh ./tools/ci/compile_shaders.ps1
          git diff --exit-code -- shaders/generated

      # DXC's DXIL output is not bit-reproducible across builds of the same
      # compiler version (dxcompiler.so non-determinism), so when the gate
      # fails the CI-regenerated bytecode is uploaded for the developer to
      # commit verbatim (bytecode authority = CI Linux dxc, DEBT-012).
      - name: Upload regenerated bytecode on drift
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: shader-bytecode-ci-authoritative
          path: shaders/generated/

  golden-sync:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v5

      - name: Cache vcpkg source archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg (pinned commit, manifest mode)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '127402f1c75bb3d5ff6bce04b285faa4930a5aca'

      - name: Install lavapipe and build toolchain (Linux)
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev libasound2-dev autoconf automake autopoint libtool libltdl-dev pkg-config autoconf-archive python3-venv

      - name: Configure and build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'linux-debug'
          buildPreset: 'linux-debug'

      - name: Regenerate golden references and assert no drift
        run: |
          ./build/linux-debug/tools/goldenimage/jrpgmaker_goldenimage generate ./tests/golden/triangle_64x64.ppm
          ./build/linux-debug/tools/goldenimage/jrpgmaker_goldenimage generate-scene ./tests/golden/scene_64x64.ppm ./assets/art/meshes/scene_hierarchy.gltf
          ./build/linux-debug/tools/goldenimage/jrpgmaker_goldenimage generate-camera ./tests/golden/camera_64x64.ppm ./assets/art/meshes/scene_hierarchy.gltf
          ./build/linux-debug/tools/goldenimage/jrpgmaker_goldenimage generate-texture ./tests/golden/texture_quad_64x64.ppm
          ./build/linux-debug/tools/goldenimage/jrpgmaker_goldenimage generate-skin ./tests/golden/skin_bind_64x64.ppm ./assets/art/meshes/arm_skinned.gltf 0.0 0.0
          ./build/linux-debug/tools/goldenimage/jrpgmaker_goldenimage generate-skin ./tests/golden/skin_wave_64x64.ppm ./assets/art/meshes/arm_skinned.gltf 1.0 1.0
          ./build/linux-debug/tools/goldenimage/jrpgmaker_goldenimage generate-skin ./tests/golden/skin_blend_64x64.ppm ./assets/art/meshes/arm_skinned.gltf 1.0 0.5
          git diff --exit-code -- tests/golden

      - name: Upload golden screenshots as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: golden-images
          path: |
            tests/golden/triangle_64x64.ppm
            tests/golden/scene_64x64.ppm
            tests/golden/camera_64x64.ppm
            tests/golden/texture_quad_64x64.ppm
            tests/golden/skin_bind_64x64.ppm
            tests/golden/skin_wave_64x64.ppm
            tests/golden/skin_blend_64x64.ppm

  private-headers:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Engine private headers are not referenced outside their module
        run: pwsh ./tools/ci/check_private_headers.ps1

      - name: Private-header audit script self-test
        run: pwsh ./tools/ci/selftest_private_headers.ps1

  data-lint:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v5

      - name: Cache vcpkg source archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg (pinned commit, manifest mode)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '127402f1c75bb3d5ff6bce04b285faa4930a5aca'

      - name: Install build toolchain system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev libasound2-dev autoconf automake autopoint libtool libltdl-dev pkg-config autoconf-archive python3-venv

      - name: Configure and build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'linux-debug'
          buildPreset: 'linux-debug'

      - name: Lint committed event data files
        run: |
          ./build/linux-debug/tools/eventlint/jrpgmaker_eventlint ./assets/data/events_demo.json
          ./build/linux-debug/tools/eventlint/jrpgmaker_eventlint --check-triggers ./assets/data/events_demo.json ./assets/data/triggers_demo.json
          ./build/linux-debug/tools/eventlint/jrpgmaker_eventlint --check-map ./assets/data/navigation_demo.json ./assets/data/collision_demo.json ./assets/data/interaction_demo.json ./assets/data/camera_demo.json ./assets/data/events_demo.json
          ./build/linux-debug/tools/eventlint/jrpgmaker_eventlint --check-project ./assets/data/project_demo.json .
          ./build/linux-debug/tools/eventlint/jrpgmaker_eventlint --build-resource-package ./assets/data/resources_demo.json . ./build/linux-debug/resources-package.json
          cp ./build/linux-debug/resources-package.json ./build/linux-debug/resources-package-repeat.json
          ./build/linux-debug/tools/eventlint/jrpgmaker_eventlint --build-resource-package ./assets/data/resources_demo.json . ./build/linux-debug/resources-package-repeat.json
          cmp ./build/linux-debug/resources-package.json ./build/linux-debug/resources-package-repeat.json
